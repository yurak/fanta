name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Matches the server, which is Ubuntu 22.04 on Ruby 3.2.2 — so the suite runs against the same
    # glibc and system libraries the native gems are built on in production.
    runs-on: ubuntu-22.04

    services:
      postgres:
        # 18 to match the RDS instance production runs on; the suite should meet the planner and
        # the collation rules it will actually meet in production.
        image: postgres:18
        env:
          POSTGRES_DB: mantra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mantra_test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Pinned, 24 is supported to 2028-04 — the longest runway of the versions that have had
          # time to settle — and it replaces Node 20, which went end-of-life in 2026-04.
          node-version: '24'

      - name: Install JS dependencies
        run: yarn install

      - name: Set up database
        run: bundle exec rails db:create db:schema:load

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop
