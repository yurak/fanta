default: &defaults
  push_api_key: "<%= Rails.application.credentials.dig(:appsignal, :push_api_key) %>"

  # The deployed commit, so AppSignal's timeline breaks exactly on a deploy. Note the env var the
  # gem reads for this is a bare APP_REVISION, without the APPSIGNAL_ prefix every other option
  # takes — easy to set the wrong name and see the value silently stay nil, which is why it is
  # spelled out here instead. Omitted outside a release directory; see config/release.rb.
<% if Fanta::Release.revision %>
  revision: "<%= Fanta::Release.revision %>"
<% end %>

  # Your app's name
  name: "Fanta"

  # Actions that should not be monitored by AppSignal
  # ignore_actions:
  #   - ApplicationController#isup

  # Errors that should not be recorded by AppSignal
  # For more information see our docs:
  # https://docs.appsignal.com/ruby/configuration/ignore-errors.html
  # ignore_errors:
  #   - Exception
  #   - NoMemoryError
  #   - ScriptError
  #   - LoadError
  #   - NotImplementedError
  #   - SyntaxError
  #   - SecurityError
  #   - SignalException
  #   - Interrupt
  #   - SystemExit
  #   - SystemStackError

  # See https://docs.appsignal.com/ruby/configuration/options.html for
  # all configuration options.

# Configuration per environment, leave out an environment or set active
# to false to not push metrics for that environment.
development:
  <<: *defaults
  active: false

production:
  <<: *defaults
  active: false

staging:
  <<: *defaults
  active: false
